name: Test Automation CI

# Run on pushes/PRs to main, nightly, and on demand with custom inputs.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # nightly regression at 02:00 UTC
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag filter'
        required: false
        default: '@smoke'
      env:
        description: 'Target environment'
        required: false
        default: 'test'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }} • ${{ github.event.inputs.env || 'test' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]   # cross-browser matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Browsers are preinstalled on ubuntu-latest runners; WebDriverManager
      # resolves the matching driver at runtime.
      - name: Run tests (${{ matrix.browser }})
        run: >
          mvn -B clean test
          -Dbrowser=${{ matrix.browser }}
          -Dheadless=true
          -Denv=${{ github.event.inputs.env || 'test' }}
          "-Dcucumber.filter.tags=${{ github.event.inputs.tags || '@smoke' }}"

      # Rerun only failures once, to absorb transient flakiness.
      - name: Rerun failed scenarios
        if: failure()
        continue-on-error: true
        run: >
          mvn -B test -Dtest=FailedTestRunner
          -Dbrowser=${{ matrix.browser }}
          -Dheadless=true
          -Denv=${{ github.event.inputs.env || 'test' }}

      - name: Upload Cucumber & Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.browser }}
          path: |
            target/allure-results
            target/cucumber-reports
            target/screenshots
            target/logs
          retention-days: 14

  publish-report:
    name: Publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Merge allure-results
        run: |
          mkdir -p allure-results
          find downloaded -type d -name allure-results -exec cp -r {}/. allure-results/ \; || true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
