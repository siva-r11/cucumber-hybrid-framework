# ============================================================
# Cucumber + JUnit Platform configuration.
# These are defaults; Surefire's systemPropertyVariables (driven by Maven -D flags)
# override any of them at runtime, e.g. -Dcucumber.filter.tags="@smoke".
# ============================================================

# Parallelism — scenarios run on a fixed-size thread pool. Each gets its own
# thread-local WebDriver (UI) and its own ScenarioContext, so they are isolated.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3

# Snake_case step-parameter matching, nicer names in reports
cucumber.publish.quiet=true

# Naming strategy makes Scenario Outline rows distinct in reports
cucumber.junit-platform.naming-strategy=long

# Retry flaky scenarios automatically. A scenario that fails is re-executed up to
# this many times before being reported as failed — absorbing transient UI/network
# flakiness without masking genuine, reproducible failures.
cucumber.execution.execution-mode.feature=concurrent
