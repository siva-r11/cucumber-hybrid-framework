# ============================================================
# Common configuration — shared defaults across ALL environments.
# Environment-specific files (dev/test/prod.properties) override
# anything here; system properties (-Dkey=val) override those.
# ============================================================

# Browser / UI defaults
browser=chrome
headless=true
implicit.wait.seconds=0
explicit.wait.seconds=15
page.load.timeout.seconds=30

# Selenium Grid (disabled by default -> local drivers via WebDriverManager)
remote.enabled=false
remote.url=http://localhost:4444/wd/hub

# API defaults
api.timeout.ms=30000
api.relaxed.ssl=false
api.key=

# Retry
retry.count=1

# Auth token endpoint path (relative to api.base.url)
auth.token.endpoint=/login
